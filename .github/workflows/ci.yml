name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.select.outputs.workflows }}
      python: ${{ steps.select.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'themes/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sf2-themes'
      - id: select
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$FILTER_OUTCOME" != "success" ||
                ( "$EVENT_NAME" == "push" &&
                  ( -z "$EVENT_BEFORE" ||
                    "$EVENT_BEFORE" == "0000000000000000000000000000000000000000" ) ) ||
                ( "$EVENT_NAME" == "pull_request" && -z "$BASE_SHA" ) ]]; then
            echo 'workflows=true' >> "$GITHUB_OUTPUT"
            echo 'python=true' >> "$GITHUB_OUTPUT"
          else
            echo "workflows=$FILTER_WORKFLOWS" >> "$GITHUB_OUTPUT"
            echo "python=$FILTER_PYTHON" >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Validate catalog
        run: python -m sf2_theme validate --all
      - name: Standalone freshness
        run: |
          python scripts/build-standalone.py
          git diff --exit-code -- sf2-themes
      - name: Lint
        run: ruff check src tests scripts
      - name: ShellCheck
        run: shellcheck tests/test_cli.sh
      - name: Shell integration
        run: tests/test_cli.sh

  ci:
    if: always()
    needs: [changes, actionlint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          PYTHON: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes job result: $CHANGES"
            exit 1
          fi
          for result in "$ACTIONLINT" "$PYTHON"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected job result: $result"; exit 1 ;;
            esac
          done
