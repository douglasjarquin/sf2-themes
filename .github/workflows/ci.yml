name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.select.outputs.workflows }}
      python: ${{ steps.select.outputs.python }}
      web: ${{ steps.select.outputs.web }}
      web_screenshots: ${{ steps.select.outputs.web_screenshots }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'themes/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sf2-themes'
            web:
              - 'web/**'
              - 'themes/**'
              - 'mise.toml'
              - 'scripts/capture-screenshots.mjs'
              - 'scripts/capture-game-screenshots.mjs'
              - 'scripts/verify-game-screenshots.mjs'
            web_screenshots:
              - 'web/src/game/**'
              - 'web/src/components/ArcadeGame.astro'
              - 'web/src/pages/game/index.astro'
              - 'web/src/data/theme-data.mjs'
              - 'web/src/styles/global.css'
              - 'web/public/screenshots/**'
              - 'themes/**'
              - 'scripts/capture-game-screenshots.mjs'
              - 'scripts/verify-game-screenshots.mjs'
      - id: select
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_WEB_SCREENSHOTS: ${{ steps.filter.outputs.web_screenshots }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$FILTER_OUTCOME" != "success" ||
                ( "$EVENT_NAME" == "push" &&
                  ( -z "$EVENT_BEFORE" ||
                    "$EVENT_BEFORE" == "0000000000000000000000000000000000000000" ) ) ||
                ( "$EVENT_NAME" == "pull_request" && -z "$BASE_SHA" ) ]]; then
            {
              echo 'workflows=true'
              echo 'python=true'
              echo 'web=true'
              echo 'web_screenshots=true'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "workflows=$FILTER_WORKFLOWS"
              echo "python=$FILTER_PYTHON"
              echo "web=$FILTER_WEB"
              echo "web_screenshots=$FILTER_WEB_SCREENSHOTS"
            } >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Validate catalog
        run: python -m sf2_theme validate --all
      - name: Standalone freshness
        run: |
          python scripts/build-standalone.py
          git diff --exit-code -- sf2-themes
      - name: Lint
        run: ruff check src tests scripts
      - name: ShellCheck
        run: shellcheck tests/test_cli.sh
      - name: Shell integration
        run: tests/test_cli.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: aube -C web ci
      - name: Install Chromium
        run: aube -C web exec playwright install --with-deps chromium
      - name: Check
        run: aube -C web run check
      - name: Unit tests
        run: aube -C web run test:unit
      - name: End-to-end tests
        run: aube -C web run test:e2e
      - name: Build
        run: aube -C web run build
      - name: Verify screenshot archive
        if: needs.changes.outputs.web_screenshots == 'true'
        run: aube -C web run screenshots:verify
      - name: Run deterministic screenshot smoke
        if: needs.changes.outputs.web_screenshots == 'true'
        run: |
          aube -C web run screenshots:game -- --theme main --seed ci-smoke --output "$RUNNER_TEMP/sf2-game-smoke"
          test -f "$RUNNER_TEMP/sf2-game-smoke/manifest.json"
          test -f "$RUNNER_TEMP/sf2-game-smoke/game/main.png"
      - name: Regenerate and verify screenshot archive
        if: needs.changes.outputs.web_screenshots == 'true'
        run: |
          aube -C web run screenshots:game
          aube -C web run screenshots:verify
          git diff --exit-code -- web/public/screenshots
      - name: Upload screenshot diagnostics
        if: always() && needs.changes.outputs.web_screenshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sf2-game-screenshot-diagnostics
          if-no-files-found: ignore
          path: |
            web/public/screenshots
            web/test-results
            web/playwright-report

  ci:
    if: always()
    needs: [changes, actionlint, test, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          PYTHON: ${{ needs.test.result }}
          WEB: ${{ needs.web.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes job result: $CHANGES"
            exit 1
          fi
          for result in "$ACTIONLINT" "$PYTHON" "$WEB"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected job result: $result"; exit 1 ;;
            esac
          done
