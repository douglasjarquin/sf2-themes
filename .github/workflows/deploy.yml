name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Configure GitHub Pages to use GitHub Actions in the repository Pages settings before deployment.
# To roll back, revert the deployed commit and let this workflow redeploy it.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: scripts/ci/run-in-dev-container.sh mise run web:install
      - name: Build
        run: scripts/ci/run-in-dev-container.sh --bind-dist mise run web:build
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
