name: Publish dev-tooling images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "mise.toml"
      - "mise.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "web/package.json"
      - "web/aube-lock.yaml"
      - "web/.npmrc"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fingerprint images
        id: fingerprint
        run: |
          echo "toolchain=$(scripts/ci/dev-image-fingerprint.sh --target toolchain)" >> "$GITHUB_OUTPUT"
          echo "dev=$(scripts/ci/dev-image-fingerprint.sh --target dev)" >> "$GITHUB_OUTPUT"
      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/toolchain/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/douglasjarquin/sf2-themes-toolchain:sha-${{ steps.fingerprint.outputs.toolchain }}
            ghcr.io/douglasjarquin/sf2-themes-toolchain:latest
          cache-from: type=registry,ref=ghcr.io/douglasjarquin/sf2-themes-toolchain:buildcache
          cache-to: type=registry,ref=ghcr.io/douglasjarquin/sf2-themes-toolchain:buildcache,mode=max
      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TOOLCHAIN_IMAGE=ghcr.io/douglasjarquin/sf2-themes-toolchain:sha-${{ steps.fingerprint.outputs.toolchain }}
          tags: |
            ghcr.io/douglasjarquin/sf2-themes-dev:sha-${{ steps.fingerprint.outputs.dev }}
            ghcr.io/douglasjarquin/sf2-themes-dev:latest
          cache-from: type=registry,ref=ghcr.io/douglasjarquin/sf2-themes-dev:buildcache
          cache-to: type=registry,ref=ghcr.io/douglasjarquin/sf2-themes-dev:buildcache,mode=max
