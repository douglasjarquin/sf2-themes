name: Verify changes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.select.outputs.workflows }}
      python: ${{ steps.select.outputs.python }}
      go: ${{ steps.select.outputs.go }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'src/**'
              - 'tests/**'
              - 'mise-tasks/**'
              - 'docker/**'
              - '.cursor/**'
              - 'scripts/**'
              - 'themes/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'mise.toml'
              - 'mise.lock'
              - 'sf2-themes'
            go:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'cmd/**'
              - 'internal/**'
              - 'themes/**'
              - 'src/**'
              - 'sf2-themes'
              - 'install.sh'
              - 'scripts/ci/build-release.sh'
              - 'scripts/ci/rehearse-install.sh'
              - '.github/release-notes.md'
              - 'mise.toml'
              - 'mise.lock'
            web:
              - 'web/**'
              - 'themes/**'
              - 'mise-tasks/generate-web-theme-data'
              - 'docker/**'
              - 'scripts/ci/**'
              - 'mise.toml'
              - 'mise.lock'
      - id: select
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          FILTER_GO: ${{ steps.filter.outputs.go }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$FILTER_OUTCOME" != "success" ||
                ( "$EVENT_NAME" == "push" &&
                  ( -z "$EVENT_BEFORE" ||
                    "$EVENT_BEFORE" == "0000000000000000000000000000000000000000" ) ) ||
                ( "$EVENT_NAME" == "pull_request" && -z "$BASE_SHA" ) ]]; then
            {
              echo 'workflows=true'
              echo 'python=true'
              echo 'go=true'
              echo 'web=true'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "workflows=$FILTER_WORKFLOWS"
              echo "python=$FILTER_PYTHON"
              echo "go=$FILTER_GO"
              echo "web=$FILTER_WEB"
            } >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: pip install -e . pytest
      - name: Tests
        run: pytest

  toolchain-checks:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate catalog
        run: scripts/ci/run-in-dev-container.sh mise run validate-catalog
      - name: Standalone freshness
        run: scripts/ci/run-in-dev-container.sh mise run standalone-freshness
      - name: Lint
        run: scripts/ci/run-in-dev-container.sh mise run lint
      - name: ShellCheck
        run: scripts/ci/run-in-dev-container.sh mise run shellcheck
      - name: Shell integration
        run: scripts/ci/run-in-dev-container.sh mise run test-cli
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: go,golangci-lint
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: go golangci-lint
      - name: Build
        run: mise run go:build
      - name: Test
        run: mise run go:test
      - name: Lint
        run: mise run go:lint
      - name: Check the Python reference against the parity goldens
        if: matrix.os == 'ubuntu-latest'
        env:
          MISE_ENABLE_TOOLS: go,python
        run: |
          mise install python
          mise run parity:check

  release-rehearsal:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Build release assets
        run: scripts/ci/build-release.sh 0.0.0-rehearsal dist
      - name: Verify checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c checksums.txt; else shasum -a 256 -c checksums.txt; fi
      - name: Check the native binaries report the stamped version
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          for bin in dist/sf2-themes_"$os"_*; do
            case "$bin" in *_amd64) arch=x86_64 ;; *) arch=arm64 ;; esac
            if [ "$arch" = "$(uname -m)" ] || { [ "$arch" = arm64 ] && [ "$(uname -m)" = aarch64 ]; }; then
              test "$("$bin" --version)" = 0.0.0-rehearsal
            fi
          done
      - name: Install into a clean Linux container and apply a theme
        if: matrix.os == 'ubuntu-latest'
        run: docker run --rm -v "$PWD/dist:/release:ro" -v "$PWD/scripts/ci:/ci:ro" debian:bookworm-slim sh /ci/rehearse-install.sh /release 0.0.0-rehearsal
      - name: Install on macOS and apply a theme
        if: matrix.os == 'macos-latest'
        run: scripts/ci/rehearse-install.sh "$PWD/dist" 0.0.0-rehearsal

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: scripts/ci/run-in-dev-container.sh mise run web:install
      - name: Build
        run: scripts/ci/run-in-dev-container.sh mise run web:build
      - name: Check
        run: scripts/ci/run-in-dev-container.sh mise run web:check
      - name: Test
        run: scripts/ci/run-in-dev-container.sh mise run web:test
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh

  gate:
    if: always()
    needs: [changes, actionlint, test, toolchain-checks, go, release-rehearsal, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          PYTHON: ${{ needs.test.result }}
          TOOLCHAIN_CHECKS: ${{ needs.toolchain-checks.result }}
          GO: ${{ needs.go.result }}
          RELEASE_REHEARSAL: ${{ needs.release-rehearsal.result }}
          WEB: ${{ needs.web.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes job result: $CHANGES"
            exit 1
          fi
          for result in "$ACTIONLINT" "$PYTHON" "$TOOLCHAIN_CHECKS" "$GO" "$RELEASE_REHEARSAL" "$WEB"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected job result: $result"; exit 1 ;;
            esac
          done
