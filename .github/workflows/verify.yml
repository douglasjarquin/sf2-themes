name: Verify changes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.select.outputs.workflows }}
      tooling: ${{ steps.select.outputs.tooling }}
      go: ${{ steps.select.outputs.go }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            tooling:
              - 'docker/**'
              - '.cursor/**'
              - 'scripts/**'
              - 'themes/**'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'install.sh'
              - 'mise.toml'
              - 'mise.lock'
            go:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'cmd/**'
              - 'internal/**'
              - 'themes/**'
              - 'install.sh'
              - 'scripts/ci/**'
              - 'docker/**'
              - '.cursor/**'
              - '.github/workflows/**'
              - '.github/release-notes.md'
              - 'mise.toml'
              - 'mise.lock'
            web:
              - 'web/**'
              - 'themes/**'
              - 'cmd/sf2-dev/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'docker/**'
              - 'scripts/ci/**'
              - 'mise.toml'
              - 'mise.lock'
      - id: select
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_TOOLING: ${{ steps.filter.outputs.tooling }}
          FILTER_GO: ${{ steps.filter.outputs.go }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          select_all=false
          if [[ "$FILTER_OUTCOME" != "success" ||
                ( "$EVENT_NAME" == "push" &&
                  ( -z "$EVENT_BEFORE" ||
                    "$EVENT_BEFORE" == "0000000000000000000000000000000000000000" ) ) ||
                ( "$EVENT_NAME" == "pull_request" && -z "$BASE_SHA" ) ]]; then
            select_all=true
          fi
          # A filter output that is missing or not a boolean is unusable data: fail open.
          for value in "$FILTER_WORKFLOWS" "$FILTER_TOOLING" "$FILTER_GO" "$FILTER_WEB"; do
            [[ "$value" == "true" || "$value" == "false" ]] || select_all=true
          done
          if [[ "$select_all" == "true" ]]; then
            {
              echo 'workflows=true'
              echo 'tooling=true'
              echo 'go=true'
              echo 'web=true'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "workflows=$FILTER_WORKFLOWS"
              echo "tooling=$FILTER_TOOLING"
              echo "go=$FILTER_GO"
              echo "web=$FILTER_WEB"
            } >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7

  toolchain-checks:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate catalog
        run: scripts/ci/run-in-dev-container.sh mise run validate-catalog
      - name: ShellCheck
        run: scripts/ci/run-in-dev-container.sh mise run shellcheck
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: go,golangci-lint
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: go golangci-lint
      - name: Build
        run: mise run build
      - name: Test
        run: mise run test
      - name: Lint
        run: mise run lint

  release-rehearsal:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Build release assets
        run: scripts/ci/build-release.sh 0.0.0-rehearsal dist
      - name: Verify checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c checksums.txt; else shasum -a 256 -c checksums.txt; fi
      - name: Check the native binaries report the stamped version
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          for bin in dist/sf2-themes_"$os"_*; do
            case "$bin" in *_amd64) arch=x86_64 ;; *) arch=arm64 ;; esac
            if [ "$arch" = "$(uname -m)" ] || { [ "$arch" = arm64 ] && [ "$(uname -m)" = aarch64 ]; }; then
              test "$("$bin" --version)" = 0.0.0-rehearsal
            fi
          done
      - name: Install into a clean Linux container and apply a theme
        if: matrix.os == 'ubuntu-latest'
        run: docker run --rm -v "$PWD/dist:/release:ro" -v "$PWD/scripts/ci:/ci:ro" debian:bookworm-slim sh /ci/rehearse-install.sh /release 0.0.0-rehearsal
      - name: Install on macOS and apply a theme
        if: matrix.os == 'macos-latest'
        run: scripts/ci/rehearse-install.sh "$PWD/dist" 0.0.0-rehearsal

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: scripts/ci/run-in-dev-container.sh mise run web:install
      - name: Build
        run: scripts/ci/run-in-dev-container.sh mise run web:build
      - name: Check
        run: scripts/ci/run-in-dev-container.sh mise run web:check
      - name: Test
        # Backstop only: a wedged browser should fail in minutes, not hold the runner for six hours.
        timeout-minutes: 20
        run: scripts/ci/run-in-dev-container.sh mise run web:test
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh

  gate:
    if: always()
    needs: [changes, actionlint, toolchain-checks, go, release-rehearsal, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED_WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          SELECTED_TOOLING: ${{ needs.changes.outputs.tooling }}
          SELECTED_GO: ${{ needs.changes.outputs.go }}
          SELECTED_WEB: ${{ needs.changes.outputs.web }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          TOOLCHAIN_CHECKS: ${{ needs.toolchain-checks.result }}
          GO: ${{ needs.go.result }}
          RELEASE_REHEARSAL: ${{ needs.release-rehearsal.result }}
          WEB: ${{ needs.web.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes job result: $CHANGES"
            exit 1
          fi
          # A selected job must succeed; a job that was not selected may only be skipped or succeed.
          check() {
            if [[ "$2" == "true" ]]; then
              [[ "$3" == "success" ]] || { echo "$1 was selected and finished: $3"; exit 1; }
            else
              case "$3" in
                success|skipped) ;;
                *) echo "$1 result: $3"; exit 1 ;;
              esac
            fi
          }
          check actionlint "$SELECTED_WORKFLOWS" "$ACTIONLINT"
          check toolchain-checks "$SELECTED_TOOLING" "$TOOLCHAIN_CHECKS"
          check go "$SELECTED_GO" "$GO"
          check release-rehearsal "$SELECTED_GO" "$RELEASE_REHEARSAL"
          check web "$SELECTED_WEB" "$WEB"
