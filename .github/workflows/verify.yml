name: Verify changes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.select.outputs.workflows }}
      python: ${{ steps.select.outputs.python }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'src/**'
              - 'tests/**'
              - 'mise-tasks/**'
              - 'docker/**'
              - 'scripts/**'
              - 'themes/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'mise.toml'
              - 'mise.lock'
              - 'sf2-themes'
            web:
              - 'web/**'
              - 'themes/**'
              - 'mise-tasks/generate-web-theme-data'
              - 'docker/**'
              - 'scripts/ci/**'
              - 'mise.toml'
              - 'mise.lock'
      - id: select
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$FILTER_OUTCOME" != "success" ||
                ( "$EVENT_NAME" == "push" &&
                  ( -z "$EVENT_BEFORE" ||
                    "$EVENT_BEFORE" == "0000000000000000000000000000000000000000" ) ) ||
                ( "$EVENT_NAME" == "pull_request" && -z "$BASE_SHA" ) ]]; then
            {
              echo 'workflows=true'
              echo 'python=true'
              echo 'web=true'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "workflows=$FILTER_WORKFLOWS"
              echo "python=$FILTER_PYTHON"
              echo "web=$FILTER_WEB"
            } >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: pip install -e . pytest
      - name: Tests
        run: pytest

  toolchain-checks:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate catalog
        run: scripts/ci/run-in-dev-container.sh mise run validate-catalog
      - name: Standalone freshness
        run: scripts/ci/run-in-dev-container.sh mise run standalone-freshness
      - name: Lint
        run: scripts/ci/run-in-dev-container.sh mise run lint
      - name: ShellCheck
        run: scripts/ci/run-in-dev-container.sh mise run shellcheck
      - name: Shell integration
        run: scripts/ci/run-in-dev-container.sh mise run test-cli
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: scripts/ci/run-in-dev-container.sh mise run web:install:ci
      - name: Build
        run: scripts/ci/run-in-dev-container.sh mise run web:build:ci
      - name: Check
        run: scripts/ci/run-in-dev-container.sh mise run web:check:ci
      - name: Test
        run: scripts/ci/run-in-dev-container.sh mise run web:test:ci
      - name: Remove this job's overlay volumes
        if: always()
        run: scripts/ci/gc-job-overlay-volumes.sh

  gate:
    if: always()
    needs: [changes, actionlint, test, toolchain-checks, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          PYTHON: ${{ needs.test.result }}
          TOOLCHAIN_CHECKS: ${{ needs.toolchain-checks.result }}
          WEB: ${{ needs.web.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes job result: $CHANGES"
            exit 1
          fi
          for result in "$ACTIONLINT" "$PYTHON" "$TOOLCHAIN_CHECKS" "$WEB"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected job result: $result"; exit 1 ;;
            esac
          done
