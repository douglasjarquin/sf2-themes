[settings]
lockfile = true

[tools]
node = "24"
aube = "2.2.4"
shellcheck = "0.11.0"
"npm:portless" = "0.15.6"
go = "1.27"
golangci-lint = "2.15"

[tasks.deps]
description = "Download Go modules and install aube and Playwright Chromium dependencies"
run = "go mod download && aube -C web install && aube -C web exec playwright install chromium"

[tasks.build]
description = "Compile every Go package and command"
run = "go build ./..."

[tasks.test]
description = "Run the Go unit, parity, and repository contract tests uncached"
run = "go test -count=1 ./..."

[tasks.lint]
description = "Check Go formatting, vet, and golangci-lint"
run = "test -z \"$(gofmt -l cmd internal themes)\" || { gofmt -l cmd internal themes; exit 1; }; go vet ./... && golangci-lint run ./..."

[tasks.shellcheck]
description = "Run shellcheck over the installer and CI scripts"
run = "shellcheck install.sh scripts/ci/*.sh docker/dev/entrypoint.sh"

[tasks."validate-catalog"]
description = "Validate every theme in the catalog"
run = "go run ./cmd/sf2-themes validate --all"

[tasks.apply]
description = "Apply a theme with the project CLI"
raw_args = true
run = "go run ./cmd/sf2-themes apply"

[tasks.setup]
description = "Set up an adapter with the project CLI"
raw_args = true
run = "go run ./cmd/sf2-themes setup"

[tasks."generate-previews"]
description = "Regenerate the SVG theme previews in docs/previews"
run = "go run ./cmd/sf2-dev previews"

[tasks."generate-web-theme-data"]
description = "Regenerate the site's theme data from the catalog"
run = "go run ./cmd/sf2-dev web-data"

[tasks."parity:record"]
description = "Re-record the parity goldens from the Go binary after an intended behavior change"
env = { SF2_PARITY_RECORD = "1" }
run = "go test -count=1 ./internal/parity"

[tasks."web:dev"]
description = "Start the Astro development server"
run = "aube -C web run dev -- --host 127.0.0.1"

[tasks."web:dev:container"]
description = "Start the Astro development server bound for container port publishing"
run = "aube -C web run dev -- --host 0.0.0.0 --port 4322"

[tasks."web:install"]
description = "Install Astro dependencies from aube-lock.yaml"
run = "aube -C web install"

[tasks."web:check"]
description = "Run Astro type and template checks"
run = "aube -C web run check"

[tasks."web:build"]
description = "Build the Astro site"
run = "aube -C web run build"

[tasks."web:test"]
description = "Run Astro unit and end-to-end tests"
run = "aube -C web run test"

[tasks.verify]
description = "Run every documented pre-PR check: Go, catalog, shell, and web"
run = "mise run web:install && mise run build && mise run test && mise run lint && mise run validate-catalog && mise run shellcheck && mise run web:check && mise run web:build && mise run web:test"

[tasks."web:dev:local"]
description = "Start the Astro dev server behind portless at https://sf2-themes.test (run web:install first)"
run = "cd web && PORTLESS_TLD=test ASTRO_DEV_BACKGROUND=1 portless"
