[tools]
node = "24"
python = "3.11"
uv = "0.11"
aube = "2.1"

[tasks.test]
description = "Run Python and standalone CLI tests"
run = ["uv run --with pytest --with pyyaml pytest -q", "bash tests/test_cli.sh"]

[tasks."web:dev"]
description = "Start the Astro development server"
run = "aube -C web run dev -- --host 127.0.0.1"

[tasks."web:install"]
description = "Install Astro dependencies from package-lock.json"
run = "aube -C web install"

[tasks."web:test"]
description = "Run Astro unit and end-to-end tests"
run = "aube -C web run test"

[tasks."web:check"]
description = "Run Astro type and template checks"
run = "aube -C web run check"

[tasks."web:build"]
description = "Build the Astro site"
run = "aube -C web run build"

[tasks."web:screenshots"]
description = "Generate the deterministic all-theme game screenshot archive"
run = "aube -C web run screenshots:game"

[tasks."web:screenshots:verify"]
description = "Verify the deterministic game screenshot archive"
run = "aube -C web run screenshots:verify"
