commands:
  format: 'gofmt -w cmd internal themes'
  lint: 'mise run lint'
  test: 'mise run test'

# Ignore these paths during review and documentation checks.
ignore_patterns:
  - "dist/**"
  - "build/**"

# Evidence is published to the orphan no-mistakes/evidence branch, not the code branch.
test:
  evidence:
    store_in_repo: true
    dir: .no-mistakes/evidence
    branch: no-mistakes/evidence
