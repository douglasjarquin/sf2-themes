version: 1
agent: codex
review:
  required: true
ci:
  required: true
commands:
  test: |
    set -e
    mise run test || exit 101
    mise run web:install:npm || exit 102
    mise run web:build:npm || exit 104
    mise run web:test:npm || exit 105
  lint: |
    set -e
    mise run lint || exit 111
    mise run shellcheck || exit 112
    mise run web:check || exit 113
