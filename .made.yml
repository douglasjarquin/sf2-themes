version: 1
agent: codex
review:
  required: true
ci:
  required: true
commands:
  test: |
    set -e
    mise run test || exit 101
    mise run web:install || exit 102
    mise run web:build || exit 104
    mise run web:test || exit 105
  lint: |
    set -e
    mise run lint || exit 111
    mise run shellcheck || exit 112
    mise run web:install || exit 113
    mise run web:check || exit 114
