version: 1
agent: codex
review:
  required: true
ci:
  required: true
commands:
  test: |
    set -e
    mise install || exit 100
    mise run test || exit 101
    mise exec -- aube -C web ci || exit 102
    mise exec -- aube -C web run themes:check || exit 103
    mise exec -- aube -C web run build || exit 104
    (cd web && n=0; for file in tests/unit/*.test.mjs test/*.test.mjs; do n=$((n + 1)); mise exec -- node --test "$file" || exit $((120 + n)); done)
    mise exec -- aube -C web run test:e2e || exit 105
  lint: |
    set -e
    mise install || exit 110
    mise exec -- uv run ruff check src tests scripts || exit 111
    shellcheck tests/test_cli.sh || exit 112
    mise exec -- aube -C web run check || exit 113
