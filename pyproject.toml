[project]
name = "sf2-themes"
version = "1.0.1"
description = "Street Fighter II color themes for WezTerm, Herdr, and Neovim"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Douglas Jarquin" }]

[project.scripts]
sf2-themes = "sf2_theme.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests", "mise-tasks"]
extend-include = [
  "mise-tasks/build-standalone",
  "mise-tasks/generate-previews",
  "mise-tasks/generate-web-theme-data",
  "mise-tasks/author-character-themes",
  "mise-tasks/import-revised-themes",
]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
